blueprint:
  name: Treppenlicht mit Taster, Helligkeit und Farbe
  description: Drei Treppenlichter werden nacheinander ein- oder ausgeschaltet. Helligkeit und Farbe sind einstellbar. Ein Richtungs-Helfer merkt sich, ob die Treppe an ist.
  domain: automation
  input:
    taster:
      name: Taster
      selector:
        device: {}
    richtungs_helfer:
      name: Richtungs-Helfer
      selector:
        entity:
          domain: input_boolean
    licht_unten:
      name: Licht unten
      selector:
        entity:
          domain: light
    licht_mitte:
      name: Licht Mitte
      selector:
        entity:
          domain: light
    licht_oben:
      name: Licht oben
      selector:
        entity:
          domain: light
    helligkeit:
      name: Helligkeit
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
    farbe:
      name: Farbe (leer lassen, wenn die Lampen keine Farbe können)
      default: []
      selector:
        color_rgb: {}
    reihenfolge_ein:
      name: Reihenfolge beim Einschalten
      default: unten
      selector:
        select:
          options:
            - label: Unten nach oben
              value: unten
            - label: Oben nach unten
              value: oben
    reihenfolge_aus:
      name: Reihenfolge beim Ausschalten
      default: oben
      selector:
        select:
          options:
            - label: Unten nach oben
              value: unten
            - label: Oben nach unten
              value: oben

triggers:
  - domain: mqtt
    device_id: !input taster
    type: action
    subtype: single
    trigger: device

variables:
  unten: !input licht_unten
  mitte: !input licht_mitte
  oben: !input licht_oben
  richtungs_helfer: !input richtungs_helfer
  helligkeit: !input helligkeit
  farbe: !input farbe
  reihenfolge_ein: !input reihenfolge_ein
  reihenfolge_aus: !input reihenfolge_aus

actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: !input richtungs_helfer
            state: "off"
        sequence:
          - repeat:
              for_each: "{{ [unten, mitte, oben] if reihenfolge_ein == 'unten' else [oben, mitte, unten] }}"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                  data: "{{ {'brightness_pct': helligkeit} | combine({'rgb_color': farbe} if farbe else {}) }}"
                - delay:
                    milliseconds: 250
          - action: input_boolean.turn_on
            target:
              entity_id: !input richtungs_helfer
    default:
      - repeat:
          for_each: "{{ [unten, mitte, oben] if reihenfolge_aus == 'unten' else [oben, mitte, unten] }}"
          sequence:
            - action: light.turn_off
              target:
                entity_id: "{{ repeat.item }}"
            - delay:
                milliseconds: 250
      - action: input_boolean.turn_off
        target:
          entity_id: !input richtungs_helfer

mode: single