blueprint:
  name: Treppenlicht mit zwei Tastern, Helligkeit, Farbe, Nachtmodus und Übergang
  description: Zwei Taster (EG und 1.OG) schalten drei Treppenlichter nacheinander ein oder aus, mit weichem Übergang. Doppelklick setzt immer den Nachtmodus mit eigener Helligkeit und Farbe und schaltet nie aus.
  domain: automation
  input:
    taster_eg:
      name: Taster EG (unten)
      selector:
        device: {}
    taster_og:
      name: Taster 1.OG (oben)
      selector:
        device: {}
    licht_unten:
      name: Licht unten
      selector:
        entity:
          domain: light
    licht_mitte:
      name: Licht Mitte
      selector:
        entity:
          domain: light
    licht_oben:
      name: Licht oben
      selector:
        entity:
          domain: light
    helligkeit:
      name: Helligkeit
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
    farbe:
      name: Farbe (leer lassen, wenn die Lampen keine Farbe können)
      selector:
        color_rgb: {}
    uebergang:
      name: Übergangszeit (Ein- und Ausblenden)
      default: 1
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          unit_of_measurement: s
    helligkeit_nacht:
      name: Helligkeit Nachtmodus (Doppelklick)
      default: 5
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
    farbe_nacht:
      name: Farbe Nachtmodus (Doppelklick, leer lassen für keine Farbe)
      default: [0, 0, 255]
      selector:
        color_rgb: {}

triggers:
  - domain: mqtt
    device_id: !input taster_eg
    type: action
    subtype: single
    trigger: device
    id: eg
  - domain: mqtt
    device_id: !input taster_og
    type: action
    subtype: single
    trigger: device
    id: og
  - domain: mqtt
    device_id: !input taster_eg
    type: action
    subtype: double
    trigger: device
    id: eg_double
  - domain: mqtt
    device_id: !input taster_og
    type: action
    subtype: double
    trigger: device
    id: og_double

variables:
  unten: !input licht_unten
  mitte: !input licht_mitte
  oben: !input licht_oben
  helligkeit: !input helligkeit
  farbe: !input farbe
  uebergang: !input uebergang
  helligkeit_nacht: !input helligkeit_nacht
  farbe_nacht: !input farbe_nacht

actions:
  - variables:
      nacht: "{{ trigger.id in ['eg_double', 'og_double'] }}"
      ein_liste: "{{ [unten, mitte, oben] if trigger.id in ['eg', 'eg_double'] else [oben, mitte, unten] }}"
      aus_liste: "{{ [oben, mitte, unten] if trigger.id in ['eg', 'eg_double'] else [unten, mitte, oben] }}"
      ziel_helligkeit: "{{ helligkeit_nacht if nacht else helligkeit }}"
      ziel_farbe: "{{ farbe_nacht if nacht else farbe }}"
  - if:
      - condition: template
        value_template: "{{ not nacht and (is_state(unten, 'on') or is_state(mitte, 'on') or is_state(oben, 'on')) }}"
    then:
      - repeat:
          for_each: "{{ aus_liste }}"
          sequence:
            - action: light.turn_off
              target:
                entity_id: "{{ repeat.item }}"
              data:
                transition: "{{ uebergang }}"
            - delay:
                milliseconds: 250
    else:
      - repeat:
          for_each: "{{ ein_liste }}"
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ (ziel_farbe or []) | length > 0 }}"
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        brightness_pct: "{{ ziel_helligkeit }}"
                        rgb_color: "{{ ziel_farbe }}"
                        transition: "{{ uebergang }}"
              default:
                - action: light.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    brightness_pct: "{{ ziel_helligkeit }}"
                    transition: "{{ uebergang }}"
            - delay:
                milliseconds: 250

mode: single