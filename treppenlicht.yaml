blueprint:
  name: Treppenlicht mit zwei Tastern, Helligkeit und Farbe
  description: Zwei Taster (EG und 1.OG) schalten drei Treppenlichter nacheinander ein oder aus. Ist mindestens ein Licht an, gehen alle aus. Helligkeit und Farbe sind einstellbar.
  domain: automation
  input:
    taster_eg:
      name: Taster EG (unten)
      selector:
        device: {}
    taster_og:
      name: Taster 1.OG (oben)
      selector:
        device: {}
    licht_unten:
      name: Licht unten
      selector:
        entity:
          domain: light
    licht_mitte:
      name: Licht Mitte
      selector:
        entity:
          domain: light
    licht_oben:
      name: Licht oben
      selector:
        entity:
          domain: light
    helligkeit:
      name: Helligkeit
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
    farbe:
      name: Farbe (leer lassen, wenn die Lampen keine Farbe können)
      selector:
        color_rgb: {}

triggers:
  - domain: mqtt
    device_id: !input taster_eg
    type: action
    subtype: single
    trigger: device
    id: eg
  - domain: mqtt
    device_id: !input taster_og
    type: action
    subtype: single
    trigger: device
    id: og

variables:
  unten: !input licht_unten
  mitte: !input licht_mitte
  oben: !input licht_oben
  helligkeit: !input helligkeit
  farbe: !input farbe

actions:
  - variables:
      ein_liste: "{{ [unten, mitte, oben] if trigger.id == 'eg' else [oben, mitte, unten] }}"
      aus_liste: "{{ [oben, mitte, unten] if trigger.id == 'eg' else [unten, mitte, oben] }}"
  - if:
      - condition: template
        value_template: "{{ is_state(unten, 'on') or is_state(mitte, 'on') or is_state(oben, 'on') }}"
    then:
      - repeat:
          for_each: "{{ aus_liste }}"
          sequence:
            - action: light.turn_off
              target:
                entity_id: "{{ repeat.item }}"
            - delay:
                milliseconds: 250
    else:
      - repeat:
          for_each: "{{ ein_liste }}"
          sequence:
            - action: light.turn_on
              target:
                entity_id: "{{ repeat.item }}"
              data:
                brightness_pct: "{{ helligkeit }}"
            - if:
                - condition: template
                  value_template: "{{ (farbe or []) | length > 0 }}"
              then:
                - action: light.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    rgb_color: "{{ farbe }}"
            - delay:
                milliseconds: 250

mode: single