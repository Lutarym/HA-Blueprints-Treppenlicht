blueprint:
  name: Treppenlicht mit Taster, Helligkeit und Farbe
  description: Drei Treppenlichter werden nacheinander ein- oder ausgeschaltet. Ist mindestens ein Licht an, gehen alle aus. Helligkeit und Farbe sind einstellbar.
  domain: automation
  input:
    taster:
      name: Taster
      selector:
        device: {}
    licht_unten:
      name: Licht unten
      selector:
        entity:
          domain: light
    licht_mitte:
      name: Licht Mitte
      selector:
        entity:
          domain: light
    licht_oben:
      name: Licht oben
      selector:
        entity:
          domain: light
    helligkeit:
      name: Helligkeit
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
    farbe:
      name: Farbe (leer lassen, wenn die Lampen keine Farbe können)
      selector:
        color_rgb: {}
    reihenfolge_ein:
      name: Reihenfolge beim Einschalten
      default: unten
      selector:
        select:
          options:
            - label: Unten nach oben
              value: unten
            - label: Oben nach unten
              value: oben
    reihenfolge_aus:
      name: Reihenfolge beim Ausschalten
      default: oben
      selector:
        select:
          options:
            - label: Unten nach oben
              value: unten
            - label: Oben nach unten
              value: oben

triggers:
  - domain: mqtt
    device_id: !input taster
    type: action
    subtype: single
    trigger: device

variables:
  unten: !input licht_unten
  mitte: !input licht_mitte
  oben: !input licht_oben
  helligkeit: !input helligkeit
  farbe: !input farbe
  reihenfolge_ein: !input reihenfolge_ein
  reihenfolge_aus: !input reihenfolge_aus

actions:
  - if:
      - condition: template
        value_template: "{{ is_state(unten, 'on') or is_state(mitte, 'on') or is_state(oben, 'on') }}"
    then:
      - repeat:
          for_each: "{{ [unten, mitte, oben] if reihenfolge_aus == 'unten' else [oben, mitte, unten] }}"
          sequence:
            - action: light.turn_off
              target:
                entity_id: "{{ repeat.item }}"
            - delay:
                milliseconds: 250
    else:
      - repeat:
          for_each: "{{ [unten, mitte, oben] if reihenfolge_ein == 'unten' else [oben, mitte, unten] }}"
          sequence:
            - action: light.turn_on
              target:
                entity_id: "{{ repeat.item }}"
              data:
                brightness_pct: "{{ helligkeit }}"
            - if:
                - condition: template
                  value_template: "{{ (farbe or []) | length > 0 }}"
              then:
                - action: light.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    rgb_color: "{{ farbe }}"
            - delay:
                milliseconds: 250

mode: single